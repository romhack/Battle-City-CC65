# Battle City (J) - NES Configuration for cc65
# Mapper 0 (NROM), 2x16KB PRG, 1x8KB CHR, Horizontal Mirroring

MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, define = yes;
    OAM:    start = $0200, size = $0100, type = rw, define = yes;
    RAM:    start = $0300, size = $0100, type = rw, define = yes;

    HEADER: start = $0000, size = $0010, file = %O, fill = yes;

    # 32KB PRG-ROM: $8000-$FFFF
    PRG:    start = $8000, size = $8000, file = %O, fill = yes, fillval = $FF, define = yes;

    CHR:    start = $0000, size = $2000, file = %O, fill = yes;
}

SYMBOLS {
    __STACKSIZE__:   type = weak, value = $0040;
    __STACK_START__: type = weak, value = $03C0;

    NES_MAPPER:      type = weak, value = 0;   # Mapper 0 (NROM)
    NES_PRG_BANKS:   type = weak, value = 2;   # 2 x 16KB = 32KB PRG
    NES_CHR_BANKS:   type = weak, value = 1;   # 1 x 8KB CHR bank
    NES_MIRRORING:   type = weak, value = 0;   # 0 = Horizontal mirroring
}

SEGMENTS {
    HEADER:   load = HEADER,          type = ro;
    ZEROPAGE: load = ZP,              type = zp;
    OAM_MEM:  load = OAM,             type = bss, optional = yes;
    BSS:      load = RAM,             type = bss, define = yes;
    
    STARTUP:  load = PRG,             type = ro,  define = yes, optional = yes;
    LOWCODE:  load = PRG,             type = ro,  optional = yes;
    INIT:     load = PRG,             type = ro,  define = yes, optional = yes;
    CODE:     load = PRG,             type = ro,  define = yes;
    RODATA:   load = PRG,             type = ro,  define = yes, optional = yes;
    DATA:     load = PRG, run = RAM,  type = rw,  define = yes, optional = yes;
    
    VECTORS:  load = PRG,             type = ro,  start = $FFFA;
    CHARS:    load = CHR,             type = ro;
}